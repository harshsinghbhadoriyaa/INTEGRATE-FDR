'use strict';

/* ═══ CONSTANTS ═══ */

  edition: '2024-25',

const IMPACT_MODEL = {

const QA_DEFENCE = [
  { q: "How is this different from a Google Sheet?", a: "Three things: (1) SHA-256 hash chain — edit one cell, chain breaks visibly. (2) Three-state verification — Sheet can't distinguish submitted vs OCR vs bank-verified. (3) Server-side workflow enforcement — Sheets cannot block a release without clearances." },
  { q: "You don't have real bank integration — isn't this fake?", a: "Correct — labelled SIMULATED everywhere. What we've built is the EVIDENCE FRAMEWORK that works even without bank API. When real integration arrives, it's one more verification state. AICTE has no framework at all today." },
  { q: "What if OCR is wrong?", a: "OCR will be wrong sometimes. That's why we DON'T treat OCR as truth. It's state 2 — with confidence bars and source regions. State 3 requires independent verification. One OCR miss ≠ fraud declaration." },
  { q: "Will this scale to 12,000 institutions?", a: "Yes. Prototype uses browser storage; production spec is PostgreSQL + S3 object storage. 30,000 instruments × 4 docs = 120,000 files, ~500GB. Trivial for S3. Horizontal scaling handles concurrency." },
  { q: "What about DPDP Act / privacy?", a: "Bank details are personally identifiable — we enforce role-based access, audit every read, encrypt at rest. Explicit DPDP consent flow documented in roadmap but not in prototype — that's honest." },
  { q: "You're not AICTE — how does adoption happen?", a: "Open specification + reference implementation. Government adoption happens when working spec exists. NIC or AICTE's in-house team can take code, spec, and evaluation methodology as starting point." },
  { q: "What if the FDR is fraudulent?", a: "We don't declare fraud. We flag for enhanced scrutiny with evidence — metadata anomalies, EXIF inconsistencies, duplicate patterns. A human officer makes every consequential decision." },
  { q: "What if institution wants to delete a wrong FDR?", a: "FDRs aren't deletable — financial instruments. We have withdraw-and-return workflow: institution marks withdrawn, scrutiny reviews, status becomes 'withdrawn' with full audit trail. History preserved." },
  { q: "What about interest on FDR?", a: "Interest settlement is handled by the bank at release. Out of scope for our regulatory tracking layer. We track the instrument lifecycle, not financial yield." },
  { q: "How do you measure 'time savings'?", a: "Honest methodology: same 10 tasks manually (stopwatch, 3 runs) and with prototype. Reported with sample size and limitations. We do NOT claim production numbers." },
];

const BEFORE_AFTER = {

/* ═══ UTILITIES ═══ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const fmtDateShort = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '—';
const fmtMoney = n => '₹' + Number(n||0).toLocaleString('en-IN');
const fmtCompact = n => { const v=Number(n||0); if(v>=1e7) return '₹'+(v/1e7).toFixed(2)+' Cr'; if(v>=1e5) return '₹'+(v/1e5).toFixed(2)+' L'; if(v>=1e3) return '₹'+(v/1e3).toFixed(1)+' K'; return '₹'+v; };
const fmtTime = ts => ts ? new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '—';
const timeAgo = ts => { if(!ts) return '—'; const s=Math.floor((Date.now()-new Date(ts))/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<604800) return Math.floor(s/86400)+'d ago'; return fmtDate(ts); };
const daysFrom = iso => Math.round((new Date(iso).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/864e5);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = name => (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function sha256(str) {
  try { const buf=new TextEncoder().encode(str); const h=await crypto.subtle.digest('SHA-256',buf); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e) { let h=0; for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;} return 'fb-'+Math.abs(h).toString(16).padStart(16,'0'); }
}
function refreshIcons(){ if(window.lucide){ try{lucide.createIcons();}catch(e){} } }
function animateNumber(el, target, opts={}) {
  if(!el) return;
  const { prefix='', suffix='', duration=800, format='money' } = opts;
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min((t-t0)/duration, 1);
    const eased = 1 - Math.pow(1-p, 3);
    const val = target * eased;
    if (format === 'money') el.textContent = prefix + Number(Math.floor(val)).toLocaleString('en-IN') + suffix;
    else if (format === 'compact') el.textContent = prefix + fmtCompact(Math.floor(val)) + suffix;
    else el.textContent = prefix + Math.floor(val) + suffix;
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ═══ CHARTS ═══ */
function donutChart({data,size=140,thickness=14}) {
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const r=(size-thickness)/2,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  let offset=0;
  const segs=data.map(d=>{ if(!d.value) return ''; const len=(d.value/total)*circ; const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${thickness}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`; offset+=len; return s; }).join('');
  const pct=Math.round((data[0]?.value||0)/total*100);
  return `<div class="relative inline-block"><svg width="${size}" height="${size}">${segs}</svg><div class="absolute inset-0 flex flex-col items-center justify-center"><div class="text-2xl font-bold font-mono">${pct}%</div><div class="text-[10px] uppercase tracking-wider text-slate-500">${esc(data[0]?.label||'')}</div></div></div>`;
}
function sparkline(values,{w=88,h=28,color='#6366f1'}={}) {
  if(!values.length) values=[0,0];
  const min=Math.min(...values),max=Math.max(...values),range=(max-min)||1;
  const pts=values.map((v,i)=>[(i/(values.length-1||1))*w,h-((v-min)/range)*h]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=`0,${h} `+line+` ${w},${h}`;
  const id='g'+uid();
  return `<svg width="${w}" height="${h}" class="overflow-visible"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#${id})"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.5" fill="${color}"/></svg>`;
}
function barChart(values,labels,{w=300,h=90,color='#6366f1'}={}) {
  const max=Math.max(...values,1),gap=8,bw=(w-gap*(values.length-1))/values.length;
  return `<div class="w-full"><svg viewBox="0 0 ${w} ${h}" class="w-full" preserveAspectRatio="none">${values.map((v,i)=>{const bh=Math.max((v/max)*h,2);return `<rect x="${i*(bw+gap)}" y="${h-bh}" width="${bw}" height="${bh}" fill="${color}" rx="3" opacity="${.35+(v/max)*.65}"/>`;}).join('')}</svg><div class="flex justify-between mt-2">${labels.map(l=>`<span class="text-[10px] text-slate-500">${esc(l)}</span>`).join('')}</div></div>`;
}
function progressRing(pct,{size=64,thickness=6,color='#10b981',track='#e2e8f0'}={}) {
  const r=(size-thickness)/2,cx=size/2,cy=size/2,circ=2*Math.PI*r,dash=(pct/100)*circ;
  return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${track}" stroke-width="${thickness}" class="dark:stroke-slate-700"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${thickness}" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${size*.24}" font-weight="700" fill="currentColor" font-family="JetBrains Mono">${pct}%</text></svg>`;
}

/* ═══ TOAST ═══ */
function toast(msg,type='ok',opts={}) {
  const root=document.getElementById('toastRoot');
  const cfg={ok:{icon:'check-circle-2',accent:'text-emerald-500',border:'border-emerald-200 dark:border-emerald-900'},error:{icon:'x-circle',accent:'text-rose-500',border:'border-rose-200 dark:border-rose-900'},warn:{icon:'alert-triangle',accent:'text-amber-500',border:'border-amber-200 dark:border-amber-900'},info:{icon:'info',accent:'text-brand-500',border:'border-brand-200 dark:border-brand-900'}}[type]||{icon:'info',accent:'text-brand-500',border:'border-slate-200'};
  const el=document.createElement('div');
  el.className=`pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md bg-white dark:bg-slate-900 ${cfg.border} min-w-[280px] max-w-md animate-fade-in`;
  el.innerHTML=`<i data-lucide="${cfg.icon}" class="w-5 h-5 mt-0.5 flex-shrink-0 ${cfg.accent}"></i><div class="flex-1 text-sm"><div class="font-medium">${esc(msg)}</div>${opts.desc?`<div class="text-slate-500 text-xs mt-0.5">${esc(opts.desc)}</div>`:''}</div><button class="text-slate-400 hover:text-slate-600 -mr-1 -mt-1 p-1 rounded"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>`;
  root.appendChild(el); refreshIcons();
  const btn=el.querySelector('button'); if(btn) btn.onclick=()=>el.remove();
  setTimeout(()=>{el.style.transition='all .3s';el.style.opacity='0';el.style.transform='translateX(24px)';setTimeout(()=>el.remove(),300);},opts.duration||4200);
}

/* ═══ MODAL ═══ */
function openModal({title,description,icon,body,actions,size='md',onMount}) {
  const sizes={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl','2xl':'max-w-6xl'};
  document.getElementById('modalRoot').innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 dark:bg-black/70 backdrop-blur-sm animate-fade-in" id="modalBackdrop"><div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full ${sizes[size]} max-h-[90vh] flex flex-col animate-scale-in border border-slate-200 dark:border-slate-800"><div class="flex items-start justify-between p-6 border-b border-slate-100 dark:border-slate-800"><div class="flex items-start gap-3">${icon?`<div class="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 flex items-center justify-center flex-shrink-0"><i data-lucide="${icon}" class="w-5 h-5"></i></div>`:''}<div><h3 class="text-lg font-semibold">${esc(title)}</h3>${description?`<p class="text-sm text-slate-500 mt-0.5">${esc(description)}</p>`:''}</div></div><button onclick="closeModal()" class="p-1.5 -m-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="p-6 overflow-y-auto flex-1">${body}</div>${actions?`<div class="px-6 py-4 bg-slate-50 dark:bg-slate-950/50 border-t border-slate-100 dark:border-slate-800 rounded-b-2xl flex justify-end gap-2">${actions}</div>`:''}</div></div>`;
  refreshIcons();
  const bd=document.getElementById('modalBackdrop');
  if(bd) bd.addEventListener('click',e=>{if(e.target.id==='modalBackdrop') closeModal();});
  if(onMount) setTimeout(onMount,30);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function toDDMMYYYY(iso){ if(!iso) return ''; const d=new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function normalizeDate(s){ if(!s) return null; s=String(s).trim(); const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; if(s.match(/^\d{4}-\d{2}-\d{2}$/)) return s; return null; }

function verificationState(iid, field){
  const bv=bankVerifFor(iid).find(b=>b.status==='verified');
  const f=findingsFor(iid).find(x=>x.field_name===field&&x.review_status==='verified');
  const ext=docsFor(iid).flatMap(d=>extractedFor(d.id)).find(e=>e.field_name===field);
  if(bv&&f) return 'verified';
  if(ext) return 'extracted';
  return 'submitted';
}

function healthScore(iid){
  const insts=DB.instruments.filter(i=>i.institution_id===iid);
  if(insts.length===0) return {overall:0,grade:'—',dims:[],insts:0,verified:0,matured:0,expiring:0};
  const active=insts.filter(i=>i.lifecycle_status==='active');
  const matured=active.filter(i=>daysFrom(i.maturity_date)<0);
  const expiring=active.filter(i=>daysFrom(i.maturity_date)>=0&&daysFrom(i.maturity_date)<=30);
  const verified=insts.filter(i=>bankVerifFor(i.id).some(b=>b.status==='verified'));
  const pendingFindings=DB.findings.filter(f=>insts.some(i=>i.id===f.instrument_id)&&f.review_status==='pending');
  const docsScore=Math.max(0,Math.round((insts.filter(i=>docsFor(i.id).length>0).length/Math.max(insts.length,1))*100));
  const verifyScore=Math.round((verified.length/Math.max(insts.length,1))*100);
  const renewalScore=Math.max(0,Math.round(100-(expiring.length/Math.max(active.length,1))*100));
  const findingScore=Math.max(0,100-pendingFindings.length*10);
  const dims=[
    {label:'Documentation',value:docsScore,color:docsScore>=80?'#10b981':docsScore>=60?'#f59e0b':'#ef4444'},
    {label:'Bank Verification',value:verifyScore,color:verifyScore>=80?'#10b981':verifyScore>=60?'#f59e0b':'#ef4444'},
    {label:'Renewal Discipline',value:renewalScore,color:renewalScore>=80?'#10b981':renewalScore>=60?'#f59e0b':'#ef4444'},
    {label:'Finding Resolution',value:findingScore,color:findingScore>=80?'#10b981':findingScore>=60?'#f59e0b':'#ef4444'}
  ];
  const overall=Math.round(dims.reduce((s,d)=>s+d.value,0)/dims.length);
  const grade=overall>=90?'A+':overall>=80?'A':overall>=70?'B':overall>=60?'C':'D';
  return {overall,grade,dims,insts:insts.length,verified:verified.length,matured:matured.length,expiring:expiring.length};
}

/* ═══ AUDIT ═══ */
async function audit(action,entity,entityId,reason=null,before=null,after=null){
  const prev=DB.audit_events.length?DB.audit_events[DB.audit_events.length-1].hash:'0'.repeat(64);
  const ts=new Date().toISOString();
  const hash=await sha256(`${prev}|${action}|${entity}|${entityId}|${reason||''}|${ts}`);
  DB.audit_events.push({id:DB.seq.audit_events++,actor_id:state.user?.id??null,actor_role:state.user?.role??'system',action,entity,entity_id:entityId,reason,before_state:before,after_state:after,timestamp:ts,prev_hash:prev,hash});
  save();
}
async function verifyAudit(){
  let prev='0'.repeat(64);
  for(const ev of DB.audit_events){
    if(ev.prev_hash!==prev) return {valid:false,broken_at:ev.id,total:DB.audit_events.length};
    const expected=await sha256(`${ev.prev_hash}|${ev.action}|${ev.entity}|${ev.entity_id}|${ev.reason||''}|${ev.timestamp}`);
    if(ev.hash!==expected) return {valid:false,broken_at:ev.id,total:DB.audit_events.length};
    prev=ev.hash;
  }
  return {valid:true,total:DB.audit_events.length};
}

/* ═══ BUSINESS LOGIC ═══ */
async function createInstrument({institution_id,reference,bank,amount,issue_date,maturity_date,filename,checksum,extracted}){
  const dup=DB.instruments.find(i=>i.reference.toLowerCase()===reference.toLowerCase());
  const inst={id:++DB.seq.instruments,institution_id:+institution_id,reference,bank,amount:+amount,issue_date,maturity_date,lifecycle_status:'active',linked_instrument_id:null,created_at:new Date().toISOString()};
  DB.instruments.push(inst);
  const doc={id:++DB.seq.documents,instrument_id:inst.id,filename,storage_path:'(client)',checksum,version:1,uploaded_by:state.user.id,uploaded_at:new Date().toISOString(),metadata:{pages:1,size:0,mime:'image/png',exif:'n/a',tamperFlags:[]}};
  DB.documents.push(doc);
  const submitted={reference,amount:String(amount),bank,issue_date:toDDMMYYYY(issue_date),maturity_date:toDDMMYYYY(maturity_date)};
  for(const[field,val]of Object.entries(extracted||{})){ if(!val) continue; DB.extracted_fields.push({id:++DB.seq.extracted_fields,document_id:doc.id,field_name:field,extracted_value:String(val),confidence:0.85,source_region:'page1'}); }
  for(const field of Object.keys(extracted||{})){
    const sub=submitted[field],ext=extracted[field];
    if(!sub||!ext) continue;
    let mismatch=false;
    if(field==='amount') mismatch=parseFloat(sub)!==parseFloat(String(ext).replace(/,/g,''));
    else if(field==='issue_date'||field==='maturity_date') mismatch=normalizeDate(sub)!==normalizeDate(ext);
    else mismatch=String(sub).trim().toLowerCase()!==String(ext).trim().toLowerCase();
    if(mismatch) DB.findings.push({id:++DB.seq.findings,document_id:doc.id,instrument_id:inst.id,field_name:field,submitted_value:sub,extracted_value:String(ext),finding_type:'mismatch',severity:'medium',review_status:'pending'});
  }
  if(dup) DB.findings.push({id:++DB.seq.findings,document_id:doc.id,instrument_id:inst.id,field_name:'reference',submitted_value:reference,extracted_value:dup.reference,finding_type:'duplicate',severity:'high',review_status:'pending'});
  DB.lifecycle_events.push({id:++DB.seq.lifecycle_events,instrument_id:inst.id,event_type:'issued',event_date:new Date().toISOString(),linked_instrument_id:null,reason:'New submission',actor_id:state.user.id});
  save();
  await audit('instrument.create','instrument',inst.id,null,null,{reference,amount});
  return inst;
}

async function reviewFinding(fid, decision, reason){
  const f=DB.findings.find(x=>x.id===fid); if(!f) return;
  const before=f.review_status; f.review_status=decision; save();
  await audit('finding.review','finding',fid,reason,{review_status:before},{review_status:decision});
}

async function createRelease(iid){
  const existing=DB.release_cases.find(r=>r.instrument_id===iid&&['submitted','pending_approval'].includes(r.status));
  if(existing){ toast('A release case is already open','warn'); return null; }
  const rc={id:++DB.seq.release_cases,instrument_id:iid,status:'submitted',requested_by:state.user.id,requested_at:new Date().toISOString(),decided_by:null,decided_at:null,decision_reason:null};
  DB.release_cases.push(rc);
  for(const req of DB.policy.requirements) DB.clearances.push({id:++DB.seq.clearances,case_id:rc.id,requirement_code:req.code,status:'missing',evidence_reference:null,reviewer_id:null,updated_at:new Date().toISOString()});
  save();
  await audit('release.create','release_case',rc.id);
  return rc;
}

async function satisfyClearance(cid, code, evidence){
  const c=DB.clearances.find(x=>x.case_id===cid&&x.requirement_code===code); if(!c) return;
  c.status='satisfied'; c.evidence_reference=evidence; c.reviewer_id=state.user.id; c.updated_at=new Date().toISOString();
  save();
  await audit('clearance.satisfy','clearance',c.id,null,null,{code,evidence});
}

async function decideRelease(cid, decision, reason){
  const rc=DB.release_cases.find(r=>r.id===cid); if(!rc) return {ok:false,msg:'Case not found'};
  if(rc.status==='approved') return {ok:false,msg:'Already approved'};
  if(decision==='approve'){
    const pending=clearancesFor(cid).filter(c=>c.status!=='satisfied').length;
    if(pending>0) return {ok:false,msg:`${pending} clearance(s) still pending — cannot approve`};
    rc.status='approved';
    const inst=getInstr(rc.instrument_id);
    if(inst) inst.lifecycle_status='released';
    DB.lifecycle_events.push({id:++DB.seq.lifecycle_events,instrument_id:rc.instrument_id,event_type:'released',event_date:new Date().toISOString(),linked_instrument_id:null,reason,actor_id:state.user.id});
  } else rc.status='rejected';
  rc.decided_by=state.user.id; rc.decided_at=new Date().toISOString(); rc.decision_reason=reason;
  save();
  await audit('release.decide','release_case',cid,reason,null,{decision});
  return {ok:true};
}

async function replaceInstrument(iid, {reference,bank,amount,issue_date,maturity_date,reason,filename,checksum,extracted}){

  const newInst={id:++DB.seq.instruments,institution_id:old.institution_id,reference,bank,amount:+amount,issue_date,maturity_date,lifecycle_status:'active',linked_instrument_id:old.id,created_at:new Date().toISOString()};
  DB.instruments.push(newInst); old.lifecycle_status='replaced';
  const doc={id:++DB.seq.documents,instrument_id:newInst.id,filename,storage_path:'(client)',checksum,version:1,uploaded_by:state.user.id,uploaded_at:new Date().toISOString(),metadata:{pages:1,size:0,mime:'image/png',exif:'n/a',tamperFlags:[]}};
  DB.documents.push(doc);
  for(const[field,val]of Object.entries(extracted||{})){ if(!val) continue; DB.extracted_fields.push({id:++DB.seq.extracted_fields,document_id:doc.id,field_name:field,extracted_value:String(val),confidence:0.85,source_region:'page1'}); }
  DB.lifecycle_events.push(
    {id:++DB.seq.lifecycle_events,instrument_id:old.id,event_type:'replaced',event_date:new Date().toISOString(),linked_instrument_id:newInst.id,reason,actor_id:state.user.id},

  );
  save();
  await audit('instrument.replace','instrument',newInst.id,reason,{old_id:old.id},{new_id:newInst.id});
  return newInst;
}

/* Deterministic bank verification — same instrument = same result */
async function simulateBankVerification(iid){
  const inst=getInstr(iid); if(!inst) return null;
  // Deterministic hash based on instrument ID — always same result
  const seed = inst.id * 7 + inst.reference.length;
  const outcomes = ['verified','verified','verified','verified','mismatch','failed'];
  const status = outcomes[seed % outcomes.length];
  const notes = status === 'verified' ? 'Details matched against bank records (simulated NEFT verification API)' : status === 'mismatch' ? 'Amount mismatch detected at bank (simulated)' : 'Bank API timeout / connection error (simulated)';
  const bv = {id:++DB.seq.bank_verifications,instrument_id:iid,reference:`BV/2025/${String(DB.seq.bank_verifications).padStart(4,'0')}`,status,bank:inst.bank,verified_by:state.user.id,verified_at:new Date().toISOString(),evidence_ref:status==='verified'?`BV-${inst.bank}-${uid().toUpperCase()}`:null,notes,mode:'simulated'};
  DB.bank_verifications.push(bv); save();
  await audit('bank.verify','instrument',iid,notes,null,{status});
  return bv;
}

async function extractFromImage(file){
  if(typeof Tesseract==='undefined'||!Tesseract.createWorker) throw new Error('OCR engine not loaded');
  const worker=await Tesseract.createWorker('eng');
  try{
    const{data:{text}}=await worker.recognize(file);
    const fields={},t=text||'';
    const ref=t.match(/FDR[-\s]?\d{4,}/i),amt=t.match(/(?:Rs\.?|INR|₹)\s*([\d,]+(?:\.\d+)?)/i),dates=t.match(/\d{2}[\/\-]\d{2}[\/\-]\d{4}/g)||[];
    if(ref) fields.reference=ref[0].trim();
    if(amt) fields.amount=amt[1].replace(/,/g,'');
    if(dates[0]) fields.issue_date=dates[0];
    if(dates[1]) fields.maturity_date=dates[1];
    return {text:t,fields};
  } finally { try{await worker.terminate();}catch(e){} }
}

function pill(text, color, opts={}){
  const colors={
    slate:'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300',
    brand:'bg-brand-50 text-brand-700 dark:bg-brand-950 dark:text-brand-300',
    emerald:'bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300',
    amber:'bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300',
    rose:'bg-rose-50 text-rose-700 dark:bg-rose-950 dark:text-rose-300'
  };
  const dotColors={slate:'bg-slate-500',brand:'bg-brand-500',emerald:'bg-emerald-500',amber:'bg-amber-500',rose:'bg-rose-500'};
  const dot=opts.dot!==false?`<span class="w-1.5 h-1.5 rounded-full ${dotColors[color]||'bg-slate-500'}"></span>`:'';
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium ${colors[color]||colors.slate}">${dot}${esc(text)}</span>`;
}
function statusPill(s){

  const[t,c]=map[s]||[s,'slate']; return pill(t,c);
}

function confidenceBar(conf){ const pct=Math.round(conf*100); const bg=pct>=85?'#10b981':pct>=70?'#f59e0b':'#ef4444'; return `<div class="flex items-center gap-2"><div class="w-16 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full rounded-full transition-all" style="width:${pct}%;background:${bg}"></div></div><span class="text-[10px] font-mono text-slate-500">${pct}%</span></div>`; }

function renderImpactTab(){
  const m=IMPACT_MODEL;
  const totalInst=m.institutionCount*m.avgInstrumentsPerInst;

  const newHours=Math.round(totalInst*m.newMinutesPerInstrumentPerMonth/60);
  const savedHours=currentHours-newHours;
  const pctReduction=Math.round((savedHours/currentHours)*100);
  return `<div class="space-y-4"><div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 rounded-lg p-3 text-xs text-amber-800 dark:text-amber-300"><div class="flex items-start gap-2"><i data-lucide="info" class="w-4 h-4 mt-0.5 flex-shrink-0"></i><div>${esc(m.caveat)}</div></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Institutions</div><div class="text-2xl font-bold font-mono">${(m.institutionCount/1000).toFixed(0)}K+</div></div><div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Est. Instruments</div><div class="text-2xl font-bold font-mono">${(totalInst/1000).toFixed(0)}K</div></div><div class="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900 rounded-xl p-4"><div class="text-[10px] text-emerald-600 uppercase tracking-wider font-semibold">Hours Saved/Mo</div><div class="text-2xl font-bold font-mono text-emerald-700 dark:text-emerald-400">${savedHours.toLocaleString('en-IN')}</div></div><div class="bg-brand-50 dark:bg-brand-950/30 border border-brand-200 dark:border-brand-900 rounded-xl p-4"><div class="text-[10px] text-brand-600 uppercase tracking-wider font-semibold">Effort Reduction</div><div class="text-2xl font-bold font-mono text-brand-700 dark:text-brand-400">${pctReduction}%</div></div></div><div><div class="text-sm font-semibold mb-2">Data Sources</div><div class="space-y-1.5">${m.dataSources.map(d=>`<div class="text-xs bg-slate-50 dark:bg-slate-800/50 p-2 rounded-lg flex items-center justify-between"><div><div class="font-medium">${esc(d.label)}</div><div class="text-slate-500 text-[10px]">Source: ${esc(d.source)}</div></div><div class="font-mono font-semibold">${esc(d.value)}</div></div>`).join('')}</div></div></div>`;

function riskExposureGrid(active){
  const tiers=[{label:'Next 30 days',days:30,color:'amber',icon:'clock',urgent:true},{label:'Next 60 days',days:60,color:'orange',icon:'calendar-clock',urgent:false},{label:'Next 90 days',days:90,color:'brand',icon:'calendar',urgent:false}];
  const maxAmount=Math.max(...tiers.map(t=>active.filter(i=>i.maturity_date&&daysFrom(i.maturity_date)>=0&&daysFrom(i.maturity_date)<=t.days).reduce((s,i)=>s+(+i.amount||0),0)),1);
  const bgMap={amber:'bg-amber-50 dark:bg-amber-950/40',orange:'bg-orange-50 dark:bg-orange-950/40',brand:'bg-brand-50 dark:bg-brand-950/40'};
  const txtMap={amber:'text-amber-600 dark:text-amber-400',orange:'text-orange-600 dark:text-orange-400',brand:'text-brand-600 dark:text-brand-400'};
  const barMap={amber:'bg-amber-500',orange:'bg-orange-500',brand:'bg-brand-500'};
  return `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">${tiers.map(t=>{
    const matching=active.filter(i=>i.maturity_date&&daysFrom(i.maturity_date)>=0&&daysFrom(i.maturity_date)<=t.days);
    const amt=matching.reduce((s,i)=>s+(+i.amount||0),0);
    const pct=Math.round((amt/maxAmount)*100);
    return `<div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 card-lift p-5"><div class="flex items-center justify-between mb-4"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg ${bgMap[t.color]} flex items-center justify-center"><i data-lucide="${t.icon}" class="w-4 h-4 ${txtMap[t.color]}"></i></div><div class="text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider">${t.label}</div></div>${t.urgent&&matching.length>0?`<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 font-semibold uppercase">Action</span>`:''}</div><div class="flex items-baseline gap-2 mb-1"><div class="text-2xl font-bold font-mono">${fmtCompact(amt)}</div><div class="text-xs text-slate-500">${matching.length} instrument${matching.length===1?'':'s'}</div></div><div class="mt-3 h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden"><div class="h-full rounded-full ${barMap[t.color]} bar-animate" style="width:${Math.max(pct,amt>0?4:0)}%"></div></div>${matching.length>0?`<button onclick="go('instruments')" class="mt-3 text-xs font-medium ${txtMap[t.color]} hover:underline">Review ${matching.length} item${matching.length===1?'':'s'} →</button>`:`<div class="mt-3 text-xs text-slate-400">All clear ✓</div>`}</div>`;
  }).join('')}</div>`;
}

function auditIcon(a){ if(a.includes('create'))return'plus'; if(a.includes('review'))return'eye'; if(a.includes('satisfy'))return'check'; if(a.includes('decide'))return'gavel'; if(a.includes('replace'))return'repeat'; if(a.includes('verify'))return'shield-check'; if(a.includes('seed'))return'database'; if(a.includes('bulk'))return'upload'; if(a.includes('withdraw'))return'undo-2'; return'activity'; }

/* ═══ PALETTE ═══ */
function openPalette(){ state.paletteOpen=true; state.paletteQuery=''; renderPalette(); setTimeout(()=>document.getElementById('paletteInput')?.focus(),50); }
function closePalette(){ state.paletteOpen=false; document.getElementById('paletteRoot').innerHTML=''; }
function getPaletteItems(q=''){
  q=q.toLowerCase().trim();
  const items=[];
  const pages=[
    {label:'Dashboard',icon:'layout-dashboard',action:()=>go('dashboard')},
    {label:'Instruments',icon:'file-text',action:()=>go('instruments')},
    {label:'Institutions',icon:'building-2',action:()=>go('institutions'),roles:['admin','auditor','approver','scrutiny']},
    {label:'Bank Verification',icon:'shield-check',action:()=>go('bankverify')},
    {label:'Bulk Upload',icon:'upload',action:()=>go('bulk'),roles:['institution','admin']},
    {label:'Admin Console',icon:'settings',action:()=>go('admin'),roles:['admin']},
    {label:'Audit Trail',icon:'scroll-text',action:()=>go('audit'),roles:['admin','auditor','approver']},
    {label:'New FDR Submission',icon:'plus-circle',action:()=>go('create'),roles:['institution','admin']},
    {label:'Judge Info',icon:'graduation-cap',action:openJudgeInfo},
    {label:'Toggle Theme',icon:'sun',action:toggleTheme},
    {label:'Logout',icon:'log-out',action:logout}
  ];
  for(const p of pages){ if(p.roles&&!p.roles.includes(state.user.role)) continue; items.push({category:'Navigation',...p}); }
  for(const i of visibleInstruments()) items.push({category:'Instruments',label:i.reference,sub:`${getInst(i.institution_id)?.code} · ${i.bank} · ${fmtCompact(i.amount)}`,icon:'file-text',action:()=>go('instrument-detail',i.id)});
  if(q){
    for(const d of DB.documents){
      const inst=getInstr(d.instrument_id);
      if(!inst||!canAccess(inst)) continue;
      const matching=DB.extracted_fields.filter(e=>e.document_id===d.id&&String(e.extracted_value).toLowerCase().includes(q));
      for(const m of matching) items.push({category:'Extracted Text',label:`${m.field_name}: ${m.extracted_value}`,sub:`From ${inst.reference} · ${Math.round(m.confidence*100)}% confidence`,icon:'scan-text',action:()=>go('instrument-detail',inst.id)});
    }
  }
  if(!q) return items.slice(0,14);
  return items.filter(i=>(i.label||'').toLowerCase().includes(q)||(i.sub||'').toLowerCase().includes(q)).slice(0,14);
}
function renderPalette(){
  const items=getPaletteItems(state.paletteQuery);
  const grouped={}; items.forEach(i=>{(grouped[i.category]=grouped[i.category]||[]).push(i);});
  document.getElementById('paletteRoot').innerHTML=`<div class="fixed inset-0 z-[70] bg-slate-900/60 dark:bg-black/70 backdrop-blur-sm animate-fade-in flex items-start justify-center pt-[12vh] px-4" id="paletteBackdrop"><div class="w-full max-w-xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden animate-scale-in"><div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 dark:border-slate-800"><i data-lucide="search" class="w-4 h-4 text-slate-400"></i><input id="paletteInput" placeholder="Search pages, instruments, extracted text…" class="flex-1 bg-transparent outline-none text-sm placeholder-slate-400" value="${esc(state.paletteQuery)}" autocomplete="off"><kbd class="hidden sm:inline-flex px-1.5 py-0.5 text-[10px] font-mono border border-slate-200 dark:border-slate-700 rounded text-slate-400">ESC</kbd></div><div class="max-h-[55vh] overflow-y-auto py-2">${items.length===0?'<div class="px-4 py-8 text-center text-sm text-slate-500">No results</div>':Object.entries(grouped).map(([cat,its])=>`<div class="px-2"><div class="px-2 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-wider text-slate-400">${cat}</div>${its.map((it,idx)=>`<button data-action="${idx}" data-cat="${esc(cat)}" class="w-full flex items-center gap-3 px-2 py-2 rounded-lg text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition text-left"><div class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i data-lucide="${it.icon}" class="w-3.5 h-3.5 text-slate-600 dark:text-slate-300"></i></div><div class="min-w-0 flex-1"><div class="font-medium truncate">${esc(it.label)}</div>${it.sub?`<div class="text-xs text-slate-500 truncate">${esc(it.sub)}</div>`:''}</div><i data-lucide="arrow-right" class="w-3.5 h-3.5 text-slate-300"></i></button>`).join('')}</div>`).join('')}</div></div></div>`;
  refreshIcons();
  const input=document.getElementById('paletteInput');
  if(input) input.addEventListener('input',e=>{state.paletteQuery=e.target.value;renderPalette();});
  document.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>{const cat=btn.dataset.cat,idx=+btn.dataset.action;closePalette();grouped[cat][idx].action();}));
  const bd=document.getElementById('paletteBackdrop');
  if(bd) bd.addEventListener('click',e=>{if(e.target.id==='paletteBackdrop')closePalette();});
}

function renderPage(){
  try{
    switch(state.page){
      case 'dashboard': return viewDashboard();
      case 'instruments': return viewInstruments();
      case 'instrument-detail': return viewInstrumentDetail(state.param);
      case 'institutions': return viewInstitutions();
      case 'bankverify': return viewBankVerify();
      case 'bulk': return viewBulk();
      case 'admin': return viewAdmin();
      case 'audit': return viewAudit();
      case 'create': return viewCreate();
      case 'replace': return viewReplace(state.param);
      default: return viewDashboard();

      if(state.page==='create') attachCreateForm();

    },30);

async function runBankVerification(iid){

function downloadSampleCSV(){
  const rows=[['reference','bank','amount','issue_date','maturity_date','filename'],['FDR-2025-201','SBI','500000','2024-04-01','2025-04-01','fdr201.png'],['FDR-2025-202','HDFC','250000','2024-06-15','2025-06-15','fdr202.png']];

function attachBulkForm(){
  const form=document.getElementById('bulkForm'); if(!form) return;
  const csvInput=document.getElementById('csvInput'),docsInput=document.getElementById('docsInput'),preview=document.getElementById('bulkPreview');
  async function updatePreview(){
    const csv=csvInput.files[0],docs=docsInput.files;
    if(!csv||!docs||docs.length===0){preview.classList.add('hidden');return;}
    const text=await csv.text();
    const lines=text.split('\n').filter(l=>l.trim());
    const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim());
    const rows=lines.slice(1).map(l=>{const vals=l.split(',').map(v=>v.replace(/^"|"$/g,'').trim());const obj={};headers.forEach((h,i)=>obj[h]=vals[i]);return obj;});
    const docsByName={}; for(const d of docs) docsByName[d.name]=d;
    preview.classList.remove('hidden');
    preview.innerHTML=`<div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-4"><div class="text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">Preview (${rows.length} rows · ${docs.length} files)</div><div class="space-y-1.5 max-h-64 overflow-y-auto">${rows.map(r=>{const hasFile=docsByName[r.filename];return `<div class="flex items-center justify-between text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-2 py-1.5"><div><span class="font-mono font-semibold">${esc(r.reference)}</span> · ${esc(r.bank)} · ${fmtMoney(r.amount)}</div><div>${hasFile?`<span class="text-emerald-600 flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> ${esc(r.filename)}</span>`:`<span class="text-slate-400 flex items-center gap-1"><i data-lucide="circle" class="w-3 h-3"></i> No file</span>`}</div></div>`;}).join('')}</div></div>`;
    refreshIcons();
  }
  csvInput.addEventListener('change',updatePreview);
  docsInput.addEventListener('change',updatePreview);
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const csv=csvInput.files[0];
    if(!csv){toast('Please upload CSV','error');return;}
    const text=await csv.text();
    const lines=text.split('\n').filter(l=>l.trim());
    const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim());
    const rows=lines.slice(1).map(l=>{const vals=l.split(',').map(v=>v.replace(/^"|"$/g,'').trim());const obj={};headers.forEach((h,i)=>obj[h]=vals[i]);return obj;});
    let success=0,failed=0;
    for(const row of rows){
      if(!row.reference||!row.bank||!row.amount||!row.issue_date||!row.maturity_date){failed++;continue;}
      const checksum=await sha256(row.reference+row.amount+Math.random());
      const extracted={reference:row.reference,amount:String(row.amount),issue_date:toDDMMYYYY(row.issue_date),maturity_date:toDDMMYYYY(row.maturity_date)};
      await createInstrument({institution_id:fd.get('institution_id'),reference:row.reference,bank:row.bank,amount:row.amount,issue_date:row.issue_date,maturity_date:row.maturity_date,filename:row.filename||'bulk.csv',checksum,extracted});
      success++;
    }
    await audit('bulk.upload','system',0,null,null,{count:success,failed});
    toast(`Bulk upload complete`,`${failed>0?'warn':'ok'}`,{desc:`${success} created, ${failed} skipped`});
    go('instruments');
  });
}

ton><button onclick="promptReview(${f.id},'accepted_correction')" class="btn-press inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium"><i data-lucide="pen" class="w-3 h-3"></i> Accept Correction</button><button onclick="promptReview(${f.id},'rejected')" class="btn-press inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 text-xs font-medium"><i data-lucide="x" class="w-3 h-3"></i> Reject</button>`:''}</div>`:''}</div>`;}).join('')}</div>`;
}
function renderDocumentsTab(i){

  return `<div class="space-y-3">${docs.map(d=>{const ext=extractedFor(d.id);const meta=d.metadata||{};const tamper=meta.tamperFlags||[];return `<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden"><div class="px-5 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between flex-wrap gap-2"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center"><i data-lucide="file-image" class="w-4 h-4 text-slate-600"></i></div><div><div class="font-medium text-sm">${esc(d.filename)} <span class="text-xs text-slate-400">v${d.version}</span></div><div class="text-xs text-slate-500">Uploaded ${timeAgo(d.uploaded_at)}</div></div></div><div class="text-right"><div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">SHA-256</div><div class="font-mono text-[10px] text-slate-500">${esc((d.checksum||'').slice(0,16))}…</div></div></div><div class="px-5 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-950/50"><div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1"><i data-lucide="microscope" class="w-3 h-3"></i> Document Forensics</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs"><div><div class="text-slate-500">MIME</div><div class="font-mono font-medium">${esc(meta.mime||'—')}</div></div><div><div class="text-slate-500">Pages</div><div class="font-mono font-medium">${esc(String(meta.pages||'—'))}</div></div><div><div class="text-slate-500">Size</div><div class="font-mono font-medium">${meta.size?(meta.size/1024).toFixed(0)+' KB':'—'}</div></div><div><div class="text-slate-500">Tamper flags</div><div class="font-medium ${tamper.length>0?'text-amber-600':'text-emerald-600'}">${tamper.length>0?tamper.length+' flagged':'None'}</div></div></div>${meta.exif?`<div class="mt-2 text-[10px] text-slate-500">EXIF: ${esc(meta.exif)}</div>`:''}${tamper.length>0?`<div class="mt-2 space-y-1">${tamper.map(t=>`<div class="text-[10px] bg-amber-50 dark:bg-amber-950/30 text-amber-700 dark:text-amber-300 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i>${esc(t)}</div>`).join('')}</div>`:''}</div>${ext.length===0?'<div class="px-5 py-4 text-sm text-slate-500">No fields extracted.</div>':`<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 dark:bg-slate-950/50 border-b border-slate-100 dark:border-slate-800"><tr class="text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider"><th class="py-2 px-5">Field</th><th class="py-2 px-3">Value</th><th class="py-2 px-3">Confidence</th><th class="py-2 px-5">Source</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${ext.map(e=>`<tr><td class="py-2.5 px-5 font-mono text-xs">${esc(e.field_name)}</td><td class="py-2.5 px-3 font-mono text-xs font-medium">${esc(e.extracted_value)}</td><td class="py-2.5 px-3">${confidenceBar(e.confidence)}</td><td class="py-2.5 px-5 text-xs text-slate-500">${esc(e.source_region||'—')}</td></tr>`).join('')}</tbody></table></div>`}</div>`;}).join('')}</div>`;
}
function renderReleaseTab(i){
  const rc=releaseCaseFor(i.id);
  const isInst=state.user.role==='institution';
  const isScrut=['scrutiny','approver','admin'].includes(state.user.role);
  const isApprover=['approver','admin'].includes(state.user.role);
  if(!rc){if(i.lifecycle_status==='active'&&isInst) return `<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">${emptyState('unlock','Release not started','Start the release workflow.',`<button onclick="startRelease(${i.id})" class="btn-press inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium"><i data-lucide="plus" class="w-4 h-4"></i> Request Release</button>`)}</div>`;return `<div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">${emptyState('lock','No release case','No active release request.')}</div>`;}
  const cls=clearancesFor(rc.id);
  const satisfied=cls.filter(c=>c.status==='satisfied').length;
  const pct=Math.round((satisfied/cls.length)*100);
  const reqMap=Object.fromEntries(DB.policy.requirements.map(r=>[r.code,r]));
  return `<div class="space-y-4"><div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6"><div class="flex items-center justify-between mb-4 flex-wrap gap-3"><div><div class="flex items-center gap-2 mb-1"><h3 class="font-semibold">Release Case #${rc.id}</h3>${statusPill(rc.status)}</div><p class="text-xs text-slate-500">Requested ${timeAgo(rc.requested_at)} by ${esc(getUser(rc.requested_by)?.full_name||'—')}</p></div><div class="flex items-center gap-3">${progressRing(pct,{size:56,thickness:5,color:pct===100?'#10b981':'#6366f1'})}<div><div class="text-xs text-slate-500">Progress</div><div class="text-sm font-semibold">${satisfied} of ${cls.length}</div></div></div></div><div class="space-y-2">${cls.map(c=>{const req=reqMap[c.requirement_code]||{label:c.requirement_code,description:''};const done=c.status==='satisfied';return `<div class="flex items-start gap-3 p-3 rounded-lg ${done?'bg-emerald-50/50 dark:bg-emerald-950/20':'bg-slate-50 dark:bg-slate-800/50'} border border-slate-200 dark:border-slate-800"><div class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 mt-0.5 ${done?'bg-emerald-500 text-white':'bg-slate-200 dark:bg-slate-700 text-slate-500'}"><i data-lucide="${done?'check':'circle-dashed'}" class="w-3.5 h-3.5"></i></div><div class="flex-1 min-w-0"><div class="text-sm font-medium">${esc(req.label)}</div><div class="text-xs text-slate-500">${esc(req.description)}</div>${done?`<div class="text-xs text-emerald-700 mt-1 flex items-center gap-1"><i data-lucide="file-check" class="w-3 h-3"></i> ${esc(c.evidence_reference)}</div>`:''}</div>${!done&&isScrut?`<button onclick="promptSatisfy(${rc.id},'${esc(c.requirement_code)}')" class="btn-press text-xs px-2.5 py-1 rounded bg-brand-600 hover:bg-brand-700 text-white font-medium flex-shrink-0">Mark satisfied</button>`:''}</div>`;}).join('')}</div>${isApprover&&rc.status==='submitted'?`<div class="mt-6 pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between flex-wrap gap-3"><div class="text-xs text-slate-500">${pct===100?'✓ All clearances satisfied':`⚠️ ${cls.length-satisfied} pending`}</div><div class="flex gap-2"><button onclick="promptDecide(${rc.id},'reject')" class="btn-press px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 text-sm font-medium hover:bg-slate-50">Reject</button><button onclick="promptDecide(${rc.id},'approve')" class="btn-press px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium ${pct<100?'opacity-50 cursor-not-allowed':''}" ${pct<100?'disabled':''}>Approve Release</button></div></div>`:''}${rc.status==='approved'?`<div class="mt-4 p-3 rounded-lg bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-900"><div class="flex items-center gap-2 text-emerald-700 text-sm font-medium"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Released ${rc.decision_reason?`<span class="font-normal">— ${esc(rc.decision_reason)}</span>`:''}</div><div class="text-xs text-emerald-600 mt-1">by ${esc(getUser(rc.decided_by)?.full_name||'—')} · ${timeAgo(rc.decided_at)}</div></div>`:''}</div></div>`;
}
function renderTimelineTab(i){

/* ═══ ACTION MODALS ═══ */
function promptReview(fid,decision){const labels={verified:'Verify',accepted_correction:'Accept Correction',rejected:'Reject'};openModal({title:`${labels[decision]} finding`,description:'Record your decision — logged in audit trail.',icon:decision==='rejected'?'x-circle':'check-circle-2',body:`<div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Reason</label><textarea id="reviewReason" rows="3" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none resize-none"></textarea></div>`,actions:`<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button><button onclick="submitReview(${fid},'${decision}')" class="btn-press px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Confirm</button>`});}
async function submitReview(fid,decision){const reason=document.getElementById('reviewReason')?.value||'';closeModal();await reviewFinding(fid,decision,reason);toast(`Finding ${decision.replace('_',' ')}`,'ok');render();}
function startRelease(iid){openModal({title:'Request release',description:'Creates a release case with required clearances.',icon:'unlock',body:`<ul class="space-y-2 text-sm">${DB.policy.requirements.map(r=>`<li class="flex items-start gap-2"><i data-lucide="circle" class="w-3 h-3 text-slate-400 mt-1"></i><div><div class="font-medium">${esc(r.label)}</div><div class="text-xs text-slate-500">${esc(r.description)}</div></div></li>`).join('')}</ul>`,actions:`<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button><button onclick="confirmRelease(${iid})" class="btn-press px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Create Release Case</button>`});}
async function confirmRelease(iid){closeModal();const rc=await createRelease(iid);if(rc){toast('Release case created','ok');state.tab='release';render();}}
function promptSatisfy(cid,code){const req=DB.policy.requirements.find(r=>r.code===code);openModal({title:`Satisfy: ${req?.label||code}`,description:'Provide evidence reference.',icon:'check-circle-2',body:`<div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Evidence reference</label><input id="satisfyEvidence" placeholder="e.g. NDC/2024/001" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none font-mono"><p class="text-xs text-slate-500 mt-2">Recorded with your user ID and timestamp.</p></div>`,actions:`<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button><button onclick="submitSatisfy(${cid},'${esc(code)}')" class="btn-press px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">Mark Satisfied</button>`});setTimeout(()=>document.getElementById('satisfyEvidence')?.focus(),60);}
async function submitSatisfy(cid,code){const ev=document.getElementById('satisfyEvidence')?.value.trim();if(!ev){toast('Evidence required','error');return;}closeModal();await satisfyClearance(cid,code,ev);toast('Clearance satisfied','ok');render();}
function promptDecide(cid,decision){openModal({title:decision==='approve'?'Approve release':'Reject release',description:decision==='approve'?'Marks the instrument as released.':'Rejects the release request.',icon:decision==='approve'?'check-circle-2':'x-circle',body:`<div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Decision reason</label><textarea id="decideReason" rows="3" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none resize-none"></textarea></div>`,actions:`<button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button><button onclick="submitDecide(${cid},'${decision}')" class="btn-press px-4 py-2 rounded-lg ${decision==='approve'?'bg-emerald-600 hover:bg-emerald-700':'bg-rose-600 hover:bg-rose-700'} text-white text-sm font-medium">Confirm</button>`});}
async function submitDecide(cid,decision){const reason=document.getElementById('decideReason')?.value||'';closeModal();const res=await decideRelease(cid,decision,reason);if(res.ok){toast(`Release ${decision}d`,'ok');render();}else toast(res.msg,'error');}

/* ═══ AUDIT ═══ */
function viewAudit(){
  const events=[...DB.audit_events].reverse();
  return `<div class="space-y-5"><div class="flex items-center justify-between flex-wrap gap-3"><div><h2 class="text-2xl font-bold tracking-tight">Audit Trail</h2><p class="text-sm text-slate-500 mt-1">Immutable hash-chained log · ${events.length} events</p></div><div class="flex gap-2"><button onclick="window.print()" class="btn-press inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm font-medium"><i data-lucide="printer" class="w-4 h-4"></i> Print</button><button onclick="runAuditVerify()" class="btn-press inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-sm font-medium"><i data-lucide="shield-check" class="w-4 h-4"></i> Verify Integrity</button></div></div><div id="verifyResult"></div><div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50 dark:bg-slate-950/50 border-b border-slate-200 dark:border-slate-800"><tr class="text-left text-[11px] font-semibold text-slate-500 uppercase tracking-wider"><th class="py-3 px-4">ID</th><th class="py-3 px-4">Timestamp</th><th class="py-3 px-4">Actor</th><th class="py-3 px-4">Action</th><th class="py-3 px-4">Entity</th><th class="py-3 px-4">Reason</th><th class="py-3 px-4">Hash</th></tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800">${events.map(e=>`<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/30"><td class="py-2.5 px-4 text-slate-400 font-mono text-xs">${e.id}</td><td class="py-2.5 px-4 text-slate-500 text-xs whitespace-nowrap">${fmtTime(e.timestamp)}</td><td class="py-2.5 px-4 text-xs">${esc(e.actor_role||'—')}</td><td class="py-2.5 px-4 text-xs font-mono text-brand-600 font-medium">${esc(e.action)}</td><td class="py-2.5 px-4 text-xs">${esc(e.entity)}#${e.entity_id}</td><td class="py-2.5 px-4 text-xs text-slate-500 max-w-[200px] truncate">${esc(e.reason||'')}</td><td class="py-2.5 px-4 font-mono text-[10px] text-slate-400">${esc((e.hash||'').slice(0,12))}…</td></tr>`).join('')}</tbody></table></div></div></div>`;
}
async function runAuditVerify(){
  const el=document.getElementById('verifyResult'); if(!el) return;
  el.innerHTML=`<div class="bg-slate-100 dark:bg-slate-800 rounded-xl p-4 flex items-center gap-3 text-sm"><div class="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full spin"></div>Verifying ${DB.audit_events.length} events…</div>`;
  const r=await verifyAudit();
  el.innerHTML=r.valid?`<div class="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900 rounded-xl p-4 flex items-start gap-3 animate-fade-in"><div class="w-8 h-8 rounded-lg bg-emerald-500 text-white flex items-center justify-center flex-shrink-0"><i data-lucide="check" class="w-5 h-5"></i></div><div><div class="font-semibold text-emerald-800 dark:text-emerald-300">Audit chain valid</div><div class="text-sm text-emerald-700 dark:text-emerald-400 mt-0.5">${r.total} events verified — no tampering</div></div></div>`:`<div class="bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900 rounded-xl p-4 flex items-start gap-3"><div class="w-8 h-8 rounded-lg bg-rose-500 text-white flex items-center justify-center flex-shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div><div><div class="font-semibold text-rose-800 dark:text-rose-300">Chain broken</div><div class="text-sm text-rose-700 mt-0.5">Tampering at #${r.broken_at}</div></div></div>`;
  refreshIcons();
}

/* ═══ NOTIFICATIONS ═══ */
function openNotifications(){
  const ns=DB.notifications.filter(n=>n.user_id===state.user.id).sort((a,b)=>b.created_at.localeCompare(a.created_at));
  const unread=ns.filter(n=>!n.read).length;
  openModal({title:'Notification Center',description:`${unread} unread · Delivery channels preview`,icon:'bell',size:'xl',

border-t border-slate-100 dark:border-slate-800"><div class="text-[10px] font-semibold uppercase tracking-wider text-violet-600 mb-2 flex items-center gap-1"><i data-lucide="mail" class="w-3 h-3"></i> Email Preview</div><div class="bg-white dark:bg-slate-900 rounded-lg p-3 border border-slate-200 dark:border-slate-700 text-xs"><div class="text-slate-500 mb-1">From: <b>notifications@fdr-sentinel.gov.in</b></div><div class="text-slate-500 mb-2">Subject: <b>${esc(n.title)}</b></div><div class="border-t border-slate-100 dark:border-slate-800 pt-2 text-slate-700 dark:text-slate-300">${esc(n.body)}</div></div><div class="text-[10px] font-semibold uppercase tracking-wider text-emerald-600 mt-3 mb-2 flex items-center gap-1"><i data-lucide="message-square" class="w-3 h-3"></i> SMS Preview</div><div class="bg-slate-800 text-white rounded-lg p-3 text-xs font-mono max-w-md"><div class="text-[10px] text-slate-400 mb-1">+91 98XXX XXXXX · ${fmtTime(n.created_at)}</div><div>FDR Sentinel: ${esc(n.title)}. Action required.</div></div></div>`:''}</div>`).join('')}</div></div>`,

-950 text-sm outline-none" required></div></div><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Amount (₹)</label><input name="amount" type="number" placeholder="500000" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm font-mono outline-none" required></div><div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Issue Date</label><input name="issue_date" type="date" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none" required></div><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Maturity Date</label><input name="maturity_date" type="date" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none" required></div></div><label for="fileInput" class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl py-8 hover:border-brand-400 cursor-pointer transition"><i data-lucide="upload-cloud" class="w-8 h-8 text-slate-400"></i><div class="text-sm font-medium">Drop file or click to upload</div><div class="text-xs text-slate-500">PNG, JPG · OCR auto-extracts</div><input id="fileInput" name="file" type="file" accept="image/*" class="hidden" required></label><div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-3 flex items-center justify-between"><div><div class="text-xs font-semibold">Demo tip</div><div class="text-xs text-slate-500">No image? Generate one</div></div><button type="button" onclick="generateSampleFDR()" class="btn-press px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-medium inline-flex items-center gap-1.5"><i data-lucide="image" class="w-3 h-3"></i> Generate sample FDR</button></div><div id="filePreview" class="hidden px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm flex items-center justify-between"><span id="fileName" class="font-mono text-xs"></span><button type="button" onclick="document.getElementById('fileInput').value='';document.getElementById('filePreview').classList.add('hidden')" class="text-xs text-slate-500 hover:text-rose-500">Remove</button></div><div id="ocrStatus" class="hidden text-sm px-3 py-2 rounded-lg"></div><div id="extractedSection" class="hidden pt-2"><div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 flex items-center gap-2"><i data-lucide="scan-text" class="w-3.5 h-3.5"></i> Extracted fields (evidence)<span class="ml-auto text-[10px] font-normal text-slate-400 normal-case">Edit to demonstrate discrepancies</span></div><div class="grid grid-cols-2 gap-3 p-4 rounded-xl bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800"><div><label class="text-[10px] font-semibold text-slate-500 uppercase">Reference</label><input name="ext_reference" class="w-full mt-1 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm font-mono outline-none"></div><div><label class="text-[10px] font-semibold text-slate-500 uppercase">Amount</label><input name="ext_amount" class="w-full mt-1 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm font-mono outline-none"></div><div><label class="text-[10px] font-semibold text-slate-500 uppercase">Issue (DD/MM/YYYY)</label><input name="ext_issue_date" class="w-full mt-1 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm font-mono outline-none"></div><div><label class="text-[10px] font-semibold text-slate-500 uppercase">Maturity (DD/MM/YYYY)</label><input name="ext_maturity_date" class="w-full mt-1 px-2 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm font-mono outline-none"></div></div></div><div class="flex justify-end gap-2 pt-4 border-t border-slate-100 dark:border-slate-800"><button type="button" onclick="go('instruments')" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button><button class="btn-press inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium shadow-lg shadow-brand-500/20"><i data-lucide="check" class="w-4 h-4"></i> Submit</button></div></form></div></div>`;

function fillDemoData(){
  const form=document.getElementById('createForm'); if(!form) return;
  form.querySelector('[name=reference]').value='FDR-2025-'+Math.floor(100+Math.random()*900);
  form.querySelector('[name=bank]').value='SBI';
  form.querySelector('[name=amount]').value='500000';
  form.querySelector('[name=issue_date]').value=today();
  form.querySelector('[name=maturity_date]').value=addDays(new Date(),365).toISOString().slice(0,10);
  if(state.user.role==='institution') form.querySelector('[name=institution_id]').value=state.user.institution_id;
  toast('Form filled with demo data','ok');
}
function generateSampleFDR(){
  const canvas=document.createElement('canvas');
  canvas.width=800; canvas.height=600;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#f8fafc'; ctx.fillRect(0,0,800,600);
  ctx.strokeStyle='#1e40af'; ctx.lineWidth=4; ctx.strokeRect(20,20,760,560);
  ctx.fillStyle='#1e40af'; ctx.font='bold 32px Georgia'; ctx.textAlign='center';
  ctx.fillText('STATE BANK OF INDIA',400,90);
  ctx.font='italic 16px Georgia'; ctx.fillStyle='#475569'; ctx.fillText('Fixed Deposit Receipt',400,120);
  ctx.textAlign='left'; ctx.fillStyle='#0f172a'; ctx.font='18px Georgia';
  ctx.fillText('FDR Reference:  FDR-2025-789',80,200);
  ctx.fillText('Amount:  Rs. 5,00,000',80,250);
  ctx.fillText('Issue Date:  01/04/2025',80,300);
  ctx.fillText('Maturity Date:  01/04/2026',80,350);
  ctx.fillText('Institution:  Sunrise Institute of Technology',80,400);
  ctx.fillStyle='#64748b'; ctx.font='14px Georgia';
  ctx.fillText('This is a computer-generated sample for demonstration purposes.',80,500);
  const link=document.createElement('a');
  link.download='FDR-2025-789-sample.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
  toast('Sample FDR downloaded','ok',{desc:'Now upload it in the form above'});
}
function attachCreateForm(){
  const form=document.getElementById('createForm'); if(!form) return;
  const fileInput=document.getElementById('fileInput'),ocrStatus=document.getElementById('ocrStatus'),extSection=document.getElementById('extractedSection'),filePreview=document.getElementById('filePreview'),fileName=document.getElementById('fileName');
  fileInput.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    filePreview.classList.remove('hidden'); fileName.textContent=`${file.name} · ${(file.size/1024).toFixed(0)} KB`;
    extSection.classList.remove('hidden');
    if(typeof Tesseract==='undefined'||!Tesseract.createWorker){ocrStatus.className='text-sm px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600';ocrStatus.innerHTML='ℹ️ OCR loading…';ocrStatus.classList.remove('hidden');return;}
    ocrStatus.className='text-sm px-3 py-2 rounded-lg bg-brand-50 dark:bg-brand-950/30 text-brand-700 border border-brand-200';ocrStatus.innerHTML='<div class="flex items-center gap-2"><div class="w-3.5 h-3.5 border-2 border-brand-500 border-t-transparent rounded-full spin"></div>Extracting…</div>';ocrStatus.classList.remove('hidden');
    try{
      const res=await extractFromImage(file);
      if(res.fields.reference) form.querySelector('[name=ext_reference]').value=res.fields.reference;
      if(res.fields.amount) form.querySelector('[name=ext_amount]').value=res.fields.amount;
      if(res.fields.issue_date) form.querySelector('[name=ext_issue_date]').value=res.fields.issue_date;
      if(res.fields.maturity_date) form.querySelector('[name=ext_maturity_date]').value=res.fields.maturity_date;
      ocrStatus.className='text-sm px-3 py-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 border border-emerald-200';
      ocrStatus.innerHTML=`<div class="flex items-center gap-2"><i data-lucide="check" class="w-4 h-4"></i> OCR complete — ${Object.keys(res.fields).length} field(s)</div>`;
      refreshIcons();
    }catch(err){ocrStatus.className='text-sm px-3 py-2 rounded-lg bg-amber-50 dark:bg-amber-950/30 text-amber-700';ocrStatus.innerHTML='⚠️ OCR unavailable — enter manually.';}
  });
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(form),file=fileInput.files[0];
    if(!file){toast('Please upload a document','error');return;}
    const extracted={reference:fd.get('ext_reference')||null,amount:fd.get('ext_amount')||null,issue_date:fd.get('ext_issue_date')||null,maturity_date:fd.get('ext_maturity_date')||null};
    Object.keys(extracted).forEach(k=>!extracted[k]&&delete extracted[k]);
    const checksum=await sha256(file.name+file.size+file.lastModified);
    const inst=await createInstrument({institution_id:fd.get('institution_id'),reference:fd.get('reference'),bank:fd.get('bank'),amount:fd.get('amount'),issue_date:fd.get('issue_date'),maturity_date:fd.get('maturity_date'),filename:file.name,checksum,extracted});
    toast('Submission created','ok');
    go('instrument-detail',inst.id);
  });
}
function viewReplace(id){
  const old=getInstr(id); if(!old) return emptyState('alert-triangle','Not found','');
  return `<div class="max-w-3xl mx-auto space-y-5"><button onclick="go('instrument-detail',${id})" class="inline-flex items-center gap-1 text-sm text-slate-600 dark:text-slate-400 hover:text-slate-900"><i data-lucide="chevron-left" class="w-4 h-4"></i> Back</button><div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6"><h2 class="text-lg font-bold mb-1">Replace / Renew Instrument</h2><p class="text-sm text-slate-500 mb-5">Old record preserved. New instrument linked with full lineage.</p><div class="rounded-lg bg-amber-50 dark:bg-amber-950/20 border border-amber-200 dark:border-amber-900 p-4 mb-5"><div class="text-[10px] font-semibold text-amber-700 uppercase mb-1">Replacing</div><div class="font-mono font-semibold">${esc(old.reference)}</div><div class="text-xs text-amber-700">${esc(old.bank)} · ${fmtMoney(old.amount)} · matures ${fmtDate(old.maturity_date)}</div></div><form id="replaceForm" class="space-y-4"><div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">New Reference</label><input name="reference" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm font-mono outline-none" required></div><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Bank</label><input name="bank" value="${esc(old.bank)}" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none" required></div></div><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Amount (₹)</label><input name="amount" type="number" value="${old.amount}" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm font-mono outline-none" required></div><div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Issue Date</label><input name="issue_date" type="date" value="${today()}" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none" required></div><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Maturity Date</label><input name="maturity_date" type="date" value="${addDays(new Date(),365).toISOString().slice(0,10)}" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none" required></div></div><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">Reason</label><input name="reason" placeholder="Maturity reached — replaced per policy" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm outline-none" required></div><div><label class="text-xs font-medium text-slate-600 dark:text-slate-400">New Document</label><input name="file" type="file" accept="image/*" class="w-full mt-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-950 text-sm" required></div><div class="flex justify-end gap-2 pt-4 border-t border-slate-100 dark:border-slate-800"><button type="button" onclick="go('instrument-detail',${id})" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button><button class="btn-press px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Create Replacement</button></div></form></div></div>`;
}
function attachReplaceForm(id){
  const form=document.getElementById('replaceForm'); if(!form) return;
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(form),file=fd.get('file');
    if(!file||!file.size){toast('Please upload new document','error');return;}
    const checksum=await sha256(file.name+file.size+file.lastModified);
    const extracted={reference:fd.get('reference'),amount:fd.get('amount'),issue_date:toDDMMYYYY(fd.get('issue_date')),maturity_date:toDDMMYYYY(fd.get('maturity_date'))};
    const newInst=await replaceInstrument(id,{reference:fd.get('reference'),bank:fd.get('bank'),amount:fd.get('amount'),issue_date:fd.get('issue_date'),maturity_date:fd.get('maturity_date'),reason:fd.get('reason'),filename:file.name,checksum,extracted});
    if(newInst){toast('Replacement created','ok');go('instrument-detail',newInst.id);}
  });
}

async function boot(){
  try{
    applyTheme();
    reload();
    if(!DB){ DB=await seedData(); save(); }
    else {
      DB.bank_verifications=DB.bank_verifications||[];
      DB.notifications=DB.notifications||[];
      DB.documents=DB.documents||[];
      DB.extracted_fields=DB.extracted_fields||[];
      DB.findings=DB.findings||[];
      DB.lifecycle_events=DB.lifecycle_events||[];
      DB.release_cases=DB.release_cases||[];
      DB.clearances=DB.clearances||[];
      DB.audit_events=DB.audit_events||[];
      DB.instruments=DB.instruments||[];
      DB.institutions=DB.institutions||[];
      DB.users=DB.users||[];
      DB.policy.history=DB.policy.history||[];
      DB.seq=DB.seq||{institutions:0,users:0,instruments:0,documents:0,extracted_fields:0,findings:0,lifecycle_events:0,release_cases:0,clearances:0,audit_events:0,bank_verifications:0,notifications:0};
    }
    if(restoreSession()) state.page='dashboard';
    else state.page='login';
    render();
  }catch(e){
    console.error('Boot failed:',e);
    const app=document.getElementById('app');
    if(app) app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-6 bg-slate-50"><div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 max-w-md text-center"><div class="w-12 h-12 rounded-xl bg-rose-100 flex items-center justify-center mx-auto mb-3"><i data-lucide="alert-triangle" class="w-6 h-6 text-rose-600"></i></div><h2 class="text-lg font-bold mb-1">Startup failed</h2><p class="text-sm text-rose-600 mb-4 font-mono break-all">${esc(e.message)}</p><button onclick="localStorage.clear();location.reload()" class="px-4 py-2 bg-brand-600 text-white rounded-lg font-medium">Reset & retry</button></div></div>`;
    refreshIcons();
  }
}
boot();
